<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#203a43">
<meta name="description" content="RGBの色を合わせるカラーマッチングゲーム">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Color Match">

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="src/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="src/favicons/favicon-16x16.png">
<link rel="apple-touch-icon" href="src/favicons/apple-touch-icon.png">

<!-- Manifest -->
<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=20261107.2">
<title>Color Match</title>
</head>

<body>
<div class="app">

<header class="header">
    <div>
        <h1>Color Match</h1>
        <p>色を見てRGBを調整し、照合しながら近づけよう</p>
    </div>
</header>

<div class="card colors">
    <div class="color-preview">
        <div id="target" class="color-box" role="img" aria-label="目標の色"></div>
        <span>TARGET</span>
    </div>
    <div class="color-preview">
        <div id="resultColor" class="color-box" role="img" aria-label="現在の色"></div>
        <span>YOU</span>
    </div>
</div>

<div class="card controls-wrap">
    <!-- 一括増加 -->
    <button id="batchUp" class="batch-btn up">
        <span class="material-symbols-outlined">add</span>
        ALL +10
    </button>

    <div class="controls">
        <div class="zone r" data-color="r" role="slider" tabindex="0" aria-label="赤" aria-valuemin="0" aria-valuemax="255" aria-valuenow="0">
            <div class="fill" id="rFill"></div>
            <div class="label">
                <span class="key-hint">A / Z</span>
                <span class="material-symbols-outlined">lens</span>
                <div class="value" id="rVal"></div>
            </div>
        </div>

        <div class="zone g" data-color="g" role="slider" tabindex="0" aria-label="緑" aria-valuemin="0" aria-valuemax="255" aria-valuenow="0">
            <div class="fill" id="gFill"></div>
            <div class="label">
                <span class="key-hint">S / X</span>
                <span class="material-symbols-outlined">lens</span>
                <div class="value" id="gVal"></div>
            </div>
        </div>

        <div class="zone b" data-color="b" role="slider" tabindex="0" aria-label="青" aria-valuemin="0" aria-valuemax="255" aria-valuenow="0">
            <div class="fill" id="bFill"></div>
            <div class="label">
                <span class="key-hint">D / C</span>
                <span class="material-symbols-outlined">lens</span>
                <div class="value" id="bVal"></div>
            </div>
        </div>
    </div>

    <!-- 一括減少 -->
    <button id="batchDown" class="batch-btn down">
        <span class="material-symbols-outlined">remove</span>
        ALL -10
    </button>
</div>

<div class="card">
    <button id="check">
        <span class="material-symbols-outlined">bolt</span>
        照合する
        <span class="key-hint-inline">Space</span>
    </button>
    <div class="secondary-actions">
        <button id="reset" class="secondary-btn">RGBをリセット</button>
        <button id="reveal" class="secondary-btn">答えを見る</button>
    </div>
</div>

<section id="feedback" class="card feedback hidden" aria-live="polite">
    <p class="eyebrow">CHECK RESULT</p>
    <h2 id="closeness">照合結果</h2>
    <p id="brightness" class="brightness"></p>
    <p id="feedback-note" class="feedback-note">ヒントを参考に調整して、もう一度照合してみよう。</p>
    <div class="channel-hints">
        <div class="channel-hint r-hint"><strong>R</strong><span id="rHint"></span></div>
        <div class="channel-hint g-hint"><strong>G</strong><span id="gHint"></span></div>
        <div class="channel-hint b-hint"><strong>B</strong><span id="bHint"></span></div>
    </div>
</section>

</div>

<!-- 答え合わせオーバーレイ -->
<div id="result-overlay" class="result-overlay hidden" role="dialog" aria-modal="true" aria-label="答え合わせ">
    <div class="result-card">
        <p class="eyebrow">ROUND REVIEW</p>
        <h2>答え合わせ</h2>
        <p class="result-score">照合回数: <span id="result-checks">0</span>回</p>
        <div class="result-colors">
            <div class="result-color-wrap">
                <div class="result-color-box" id="result-target"></div>
                <div class="result-color-label">TARGET</div>
                <div class="result-rgb" id="target-rgb"></div>
            </div>
            <span class="material-symbols-outlined result-vs">compare_arrows</span>
            <div class="result-color-wrap">
                <div class="result-color-box" id="result-player"></div>
                <div class="result-color-label">YOU</div>
                <div class="result-rgb" id="player-rgb"></div>
            </div>
        </div>
        <button id="next-btn" class="next-btn">
            <span class="material-symbols-outlined">arrow_forward</span>
            次の色へ
            <span class="key-hint-inline">Enter</span>
        </button>
    </div>
</div>

<script src="main.js?v=20261107.2"></script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
}
</script>
</body>
</html>
